<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIFA World Cup 2026 - Stadium Navigation Assistant</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- React & Babel Standalone CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fifaGreen: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                            900: '#022c22',
                        },
                        fifaGold: {
                            400: '#fbbf24',
                            500: '#f59e0b',
                            600: '#d97706',
                            700: '#b45309',
                        },
                        fifaRed: {
                            500: '#ef4444',
                            600: '#dc2626',
                            700: '#b91c1c',
                        },
                        stadiumDark: {
                            800: '#121814',
                            900: '#080d09',
                            950: '#040705',
                        }
                    },
                    fontFamily: {
                        heading: ['Outfit', 'sans-serif'],
                        body: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom high-contrast overrides */
        .high-contrast {
            --tw-bg-opacity: 1 !important;
            background-color: #000000 !important;
            color: #ffffff !important;
        }
        .high-contrast * {
            border-color: #ffffff !important;
        }
        .high-contrast-btn {
            background-color: #000000 !important;
            border: 2px solid #ffffff !important;
            color: #ffff00 !important;
        }
        .high-contrast-text {
            color: #ffffff !important;
        }
        .high-contrast-yellow {
            color: #ffff00 !important;
        }
        
        /* Custom focus outline */
        *:focus-visible {
            outline: 4px solid #f59e0b !important;
            outline-offset: 2px !important;
        }
        
        /* Custom styles for accessibility */
        .large-text-mode {
            font-size: 1.15rem !important;
        }
        .large-text-mode h1 {
            font-size: 1.75rem !important;
        }
        .large-text-mode h2 {
            font-size: 1.5rem !important;
        }
        .large-text-mode h3 {
            font-size: 1.25rem !important;
        }
        .large-text-mode p, .large-text-mode span, .large-text-mode button, .large-text-mode input {
            font-size: 1.1rem !important;
        }
        
        /* Scrollbar styles */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body class="bg-stadiumDark-950 text-gray-100 font-body min-h-screen flex flex-col antialiased">
    <!-- Announcement log for screen reader updates -->
    <div id="announcement-log" class="sr-only" aria-live="assertive"></div>

    <div id="root" class="flex-1 flex flex-col"></div>

    <!-- Load the main React app script -->
    <script type="text/babel" src="/app.js"></script>
</body>
</html>
